simulation_metadata:
  device: cpu
  calibration: false
  num_steps_per_episode: 3
  num_substeps_per_step: 1
state:
  initialization_function:
    generator: initialize_community
  agents:
    plants:
      properties:
      - ids
      - species
      - defense
      - voc_trait
      - chemical_traits
      - cells
      - genotypes
    insects:
      properties:
      - ids
      - species
      - resistance
      - preference
      - sex
      - cells
      - genotypes
      - birth_host_id
      - birth_host_species
      - adult_cohort
substeps:
  '0':
    name: adult_oviposition_larval_recruitment
    active_agents: []
    transition:
      advance:
        generator: advance_generation
        input_variables:
          runtime: environment/runtime
          agents: agents
          terminated: terminated
        output_variables:
        - agents
        - terminated
        arguments:
          fixed: {}
parameters: {}
