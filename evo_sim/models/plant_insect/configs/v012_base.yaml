  insect_life_history: self_feeding_pre_reproductive
  feeding_window: one_generation_pre_reproductive_feeding
  demand_window: one_generation_pre_reproductive_feeding
  seed: 20261025
  plant_sizes: [20, 20]
  insect_sizes: [24]
  spatial:
    grid_shape: [6, 6]
    initial_plant_cells:
    - [0, 0]
    - [0, 1]
