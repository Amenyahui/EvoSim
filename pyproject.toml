[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoSim"
version = "1.0.0"
description = "Configuration-driven plant-insect coevolution simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.scripts]
evosim = "evo_sim.models.plant_insect.batch:main"

[tool.setuptools.packages.find]
include = ["evo_sim*"]

[tool.setuptools.package-data]
"evo_sim.models.plant_insect" = ["config.yaml", "configs/*.yaml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
