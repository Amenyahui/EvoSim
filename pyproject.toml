[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoSim"
version = "0.1.7"
description = "Configuration-driven plant-insect coevolution simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.scripts]
evosim = "evo_sim.models.plant_insect.batch:main"

[tool.setuptools.packages.find]
include = ["evo_sim*"]

[tool.setuptools.package-data]
"evo_sim.models.plant_insect" = ["config.yaml", "configs/*.yaml", "analysis/*.yaml", "inputs/*.csv", "inputs/v012/*.csv", "inputs/v017/*.csv", "inputs/v017_no_flowering/*.csv"]
"evo_sim.models.plant_insect.helpers" = ["*.slim"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]
